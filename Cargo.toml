[package]
name = "crystal-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# bevy_diagnostic = "0.14.2"
bevy_time = "0.14.2"
crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
fastrand = "2.0.0"
flume = "0.11.1"
noise = "0.9.0"
postcard = "1.1.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.9.11"
tracing = "0.1.41"
valence = { git = "https://github.com/valence-rs/valence", features = ["advancement", "equipment", "inventory", "network", "player_list", "anvil", "boss_bar", "command", "scoreboard", "weather", "world_border"]}

[build-dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.219"
serde_json = "1.0.140"
# vek = { version = "0.17.1", features = ["repr_simd"] }
